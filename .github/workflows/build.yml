name: Build

on:
  push:
    branches:
      - main
      - 'releases/*' # The release branches
    paths:
      - 'go.*'
      - '**/*.go'
      - 'src/**'
      - '.github/workflows/build.yml'
  #    tags:
  #      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'
    paths:
      - 'go.*'
      - '**/*.go'
      - 'src/**'
      - '.github/workflows/*.yml'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@v1
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      disable-version-bumping: true
      code_coverage: true
      # Temporary Filetug MVP floor. Restore 100% before the final Bubble Tea
      # hard cutover, after its full parity and retirement tests are in place.
      min_test_coverage_percent: 97.5
