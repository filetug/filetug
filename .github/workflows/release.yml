name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run (GoReleaser against this repo's .goreleaser.yaml).
# Pushing an explicit `vX.Y.Z` tag also works and releases that exact version.
# A docs/chore-only merge cuts no tag and publishes nothing.
#
# filetug is pre-1.0: allow_major_version_bump stays false, so a stray `feat!:`
# is capped to a minor bump instead of jumping to v1.0.0. Cut v1.0.0 deliberately
# by pushing that tag.
#
# Homebrew publishing is a cask (see .goreleaser.yaml); the `ft` shortcut is
# preserved via the cask's custom_block.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned to an immutable tag rather than the floating `v1` of strongo/cicd:
    # @v1 defines the require_notarized_macos input but does not contain the
    # macos_signing_preflight job that implements it, making the flag a silent
    # no-op there. @v1.14.14 contains both.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.14
    permissions:
      contents: write
    with:
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      # Cross-repo PAT for the Homebrew tap (filetug/homebrew-filetug), forwarded
      # to GoReleaser as $GORELEASER_GITHUB_TOKEN and referenced by the cask's
      # repository.token.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.FILETUG_GORELEASER_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml. Previously withheld under a diagnosis (Go 1.27 Mach-O
      # output) that was WRONG: the real cause was a .p12 rebuilt without the
      # Apple Root CA, putting the G2 intermediate at cert-chain index 0, which
      # quill emits as `root` in the designated requirement — unsatisfiable,
      # hence SIGKILL. The .p12 has been rebuilt with the full chain and pushed
      # to all org secret stores; proven on a real Go 1.27 binary
      # (ingitdb/ingitdb-cli v0.65.11): signed, notarized, spctl-accepted, runs.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
